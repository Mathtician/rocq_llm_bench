[project]
name = "rlb"
version = "0.1.0"
description = "Meta-harness benchmarking LLM agent harnesses on Rocq theorem proving"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
rlb = "rlb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlb"]

[dependency-groups]
analysis = [
    "numpy>=2.4.4",
    "scipy>=1.18.1",
]
dev = [
    "pytest>=9.1.1",
]
