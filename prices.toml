# Keyed by the config model id (pi: with its provider prefix), or by the id a provider reports
# as the served model (logged by the proxy); rlb.cost reads this file.
# API list prices, USD per 1M tokens, compiled 2026-09-23.
# Keys: input (uncached), cached_input (cache read), cache_write (single cache-write price),
# cache_write_5m / cache_write_1h (Anthropic), output.
# long_* keys: price for requests whose prompt exceeds long_context_threshold_tokens
# (the whole request is billed at the long rate). Base keys are always the <=threshold tier.
# Omitted key = that price does not exist / is not listed.

# ---------------- OpenAI (used via ChatGPT plan through Codex) ----------------
# Source for all: https://developers.openai.com/api/docs/pricing (Standard tier, fetched 2026-09-23)
# "reasoning tokens ... are billed as output tokens" (developers.openai.com/api/docs/guides/reasoning)
# Model page for gpt-6-astra: "prompts with more than 272K input tokens are priced at 2x input and
# cache rates and 1.5x output for the full request"; pricing table header labels short context "<272K".

[models."gpt-6-astra"]
input = 10.0
cached_input = 1.0
cache_write = 12.5
output = 50.0
long_context_threshold_tokens = 272000
long_input = 20.0
long_cached_input = 2.0
long_cache_write = 25.0
long_output = 75.0
source = "https://developers.openai.com/api/docs/pricing ; https://developers.openai.com/api/docs/models/gpt-6-astra (fetched 2026-09-23)"
note = "reasoning tokens billed as output; OpenAI now lists a separate cache-write price; regional/data-residency endpoints +10%"

